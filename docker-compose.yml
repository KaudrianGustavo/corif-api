services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corif_api
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - corif_network

  nginx:
    image: nginx:alpine
    container_name: corif_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.10:80:80"
      - "127.0.0.10:443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certs:/etc/nginx/certs
    depends_on:
      - api
    networks:
      - corif_network

  mysql:
    image: mysql:8.0
    container_name: corif_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - corif_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - corif_network

volumes:
  corif_mysql_data:

networks:
  corif_network:
    driver: bridge